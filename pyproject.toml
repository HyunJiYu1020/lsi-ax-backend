[project]
name = "slsi-backend"
version = "0.1.0"
description = "S.LSI 예산관리 플랫폼 백엔드"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=0.80.0",
    "boto3>=1.40.0",
    "fastapi>=0.151.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.0",
    "mcp>=1.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 화면을 실제로 띄워 보는 테스트는 브라우저를 켜느라 2분쯤 걸린다 — 나머지(80초)와 섞이면
# 매번 돌릴 엄두가 안 난다. 평소에는 `pytest -m "not slow"`로 빼고, 화면 코드를 건드렸거나
# 죽은 코드를 지웠을 때 전체를 돌린다.
markers = [
    "slow: 브라우저를 띄우는 등 오래 걸리는 테스트 (pytest -m 'not slow'로 제외)",
    # AI 판단 품질 평가(tests/eval) — 실제 LLM을 부르므로 RUN_EVAL=1 없이는 전부 skip된다.
    # 마커를 따로 두는 이유: 돈과 네트워크가 드는 데다 같은 입력에 늘 같은 답이 오지 않아서,
    # 평소 pytest에 섞이면 "가끔 빨간" 테스트가 되고 그러면 아무도 빨간색을 안 믿게 된다.
    "eval: AI 판단 품질 평가 (RUN_EVAL=1 .venv/bin/python -m pytest tests/eval)",
]
